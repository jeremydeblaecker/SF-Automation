<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MercySF Reborn Preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#090b10;color:#f5f7fb}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#0c0f15;border-right:1px solid #222733;padding:22px 14px}.brand{font-weight:800;font-size:20px;padding:7px 10px 24px}.brand span{color:#8b6cff}.nav{display:block;width:100%;border:0;background:transparent;color:#8991a0;text-align:left;padding:11px 12px;border-radius:9px;margin:3px 0}.nav.active{background:#171b24;color:#fff;box-shadow:inset 3px 0 #8a6cff}main{padding:30px 38px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;color:#737d8f;letter-spacing:.15em}.top h1{margin:3px 0 24px}.master{border:0;background:#7c5cff;color:white;padding:10px 16px;border-radius:9px;font-weight:700;cursor:pointer}.hero,.card,.logs{background:#11151e;border:1px solid #242b36;border-radius:14px}.hero{padding:20px;display:flex;align-items:center;gap:14px;margin-bottom:25px}.avatar{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#6751de,#b675ff);font-weight:900;font-size:22px}.hero h2{margin:2px 0}.hero p,.section p,.card p{margin:3px 0;color:#798293;font-size:12px}.engine{margin-left:auto;color:#6edf9f}.section{display:flex;justify-content:space-between;align-items:end}.section h2{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:13px}.card{padding:17px}.head{display:flex;justify-content:space-between}.head h3{margin:0}.toggle{border:1px solid #57469b;color:#9d85ff;background:#1b1730;border-radius:8px;padding:7px;cursor:pointer}.status{display:flex;gap:7px;align-items:center;margin:18px 0 10px;font-size:12px}.dot{width:7px;height:7px;background:#55d89a;border-radius:50%}.why{height:38px}.run{width:100%;border:1px solid #2a303d;background:#171b24;color:#d0d4dc;padding:8px;border-radius:8px;cursor:pointer}.logs{margin-top:24px;padding:17px}.log{display:grid;grid-template-columns:80px 1fr;gap:10px;border-top:1px solid #202630;padding:10px 0;font-size:12px}.log time{color:#666f80}.log span{color:#a8afbc}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}main{padding:20px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span>M</span>ercySF Reborn</div><button class="nav active">Dashboard</button><button class="nav">Personnages</button><button class="nav">Taverne</button><button class="nav">Arène</button><button class="nav">Donjons</button><button class="nav">Forteresse · V2</button><button class="nav">Paramètres</button></aside><main><div class="top"><div><div class="eyebrow">AUTOMATION CONTROL CENTER</div><h1>Dashboard</h1></div><button id="master" class="master">▶ Démarrer</button></div><div class="hero"><div class="avatar">A</div><div><small>Personnage actif</small><h2>Aldric</h2><p>Niveau 452 · Guerrier · s1.fr</p></div><div id="engine" class="engine">● En pause</div></div><div class="section"><div><h2>Automatisations</h2><p>Mode simulation : aucune requête n'est envoyée au jeu.</p></div><small>3/3 actives</small></div><div id="grid" class="grid"></div><div class="logs"><div class="section"><div><h2>Activité</h2><p>Décisions du moteur</p></div></div><div id="loglist"></div></div></main></div><script>
const modules=[['Taverne','Quêtes et expéditions','Meilleur ratio XP / temps'],['Arène','Combats et sélection d’adversaire','Meilleur score risque / récompense'],['Donjons','Tentatives disponibles','Personnage prêt et tentative disponible']];const grid=document.querySelector('#grid'),logs=document.querySelector('#loglist');let running=false;function log(t){const d=document.createElement('div');d.className='log';d.innerHTML=`<time>${new Date().toLocaleTimeString('fr-FR')}</time><span>${t}</span>`;logs.prepend(d)}modules.forEach(([name,desc,why])=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="head"><div><h3>${name}</h3><p>${desc}</p></div><button class="toggle">⏻</button></div><div class="status"><i class="dot"></i><b>Actif</b><span style="margin-left:auto">Prêt</span></div><p class="why">${why}</p><button class="run">▶ Exécuter maintenant</button>`;c.querySelector('.run').onclick=()=>{log(`${name} : analyse…`);setTimeout(()=>log(`${name} : action simulée exécutée — ${why}`),350)};grid.appendChild(c)});document.querySelector('#master').onclick=e=>{running=!running;e.target.textContent=running?'■ Arrêter':'▶ Démarrer';document.querySelector('#engine').textContent=running?'● En fonctionnement':'● En pause';log(running?'Moteur démarré':'Moteur arrêté')};log('MercySF Reborn initialisé en mode simulation.');
</script></body></html>
