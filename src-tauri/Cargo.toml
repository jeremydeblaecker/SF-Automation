[package]
name = "mercysf-reborn"
version = "0.3.1"
description = "MercySF Reborn desktop shell"
authors = ["MercySF Reborn contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
chrono = "0.4"
sf-api = { version = "0.4.1", features = ["sso", "serde"] }
